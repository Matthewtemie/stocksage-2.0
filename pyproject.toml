[project]
name = "stocksage"
version = "0.2.0"
description = "ML-powered stock prediction with full MLOps"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Matthewtemie" }
]

dependencies = [
    # Runtime deps from StockSage 1.0 (kept identical to preserve Render compatibility)
    "alpaca-py>=0.21.0",
    "pytz>=2024.1",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "flask>=3.0.0",
    "apscheduler>=3.10.0",
    "joblib>=1.3.0",
    "gunicorn>=21.2.0",
    # New for 2.0
    "python-dotenv>=1.0.0",   # load .env files
    "loguru>=0.7.0",           # better logging than stdlib
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
    "pandera>=0.20.0",         # data schema validation
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    | _legacy
    | venv
    | \.venv
    | build
    | dist
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "_legacy",
    "venv",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]  # pycodestyle, pyflakes, isort, warnings
ignore = ["E501"]              # line length handled by black

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
